  <script>(function () { var n = document.getElementById('navPill'), m = document.getElementById('mobileMenu'); window.addEventListener('scroll', function () { if (n) n.classList.toggle('scrolled', window.scrollY > 20); }); var b = document.getElementById('hamburgerBtn'), c = document.getElementById('mobileClose'); function op() { m.classList.add('open'); document.body.style.overflow = 'hidden'; } function cl() { m.classList.remove('open'); document.body.style.overflow = ''; } if (b) b.addEventListener('click', op); if (c) c.addEventListener('click', cl); if (m) m.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', cl); }); window.toggleFaq = function (el) { el.parentElement.classList.toggle('open'); }; var obs = new IntersectionObserver(function (entries) { entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('active'); obs.unobserve(e.target); } }); }, { threshold: 0.08, rootMargin: '0px 0px -32px 0px' }); document.querySelectorAll('.reveal').forEach(function (el) { obs.observe(el); }); }());</script>
