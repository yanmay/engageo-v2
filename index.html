<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Engageo | Missed-Call Recovery for Indian Clinics</title>
    <meta name="description" content="Engageo answers missed clinic calls in under 8 seconds — books the appointment, sends a WhatsApp confirmation, and recovers the revenue your front desk lets slip. For Hair Transplant, Dental, and IVF clinics across India." />
    <meta name="theme-color" content="#3D5AFE" />

    <!-- Open Graph (WhatsApp / LinkedIn / Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://engageo.in/" />
    <meta property="og:title" content="Engageo | AI Missed-Call Recovery for Clinics" />
    <meta property="og:description" content="Every missed call is a patient lost. Engageo answers in 8 seconds, qualifies the lead, books the slot, and sends the WhatsApp confirmation — automatically." />
    <meta property="og:image" content="https://engageo.in/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Engageo | AI Missed-Call Recovery for Clinics" />
    <meta name="twitter:description" content="Every missed call is a patient lost. Engageo answers in 8 seconds, qualifies the lead, books the slot, and sends the WhatsApp confirmation — automatically." />
    <meta name="twitter:image" content="https://engageo.in/og-image.png" />

    <!-- Fonts — display=swap prevents invisible text during load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body class="noise-overlay text-dark bg-background">
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        document.getElementById('root').innerHTML = '<pre style="padding:2rem;color:red;">ERROR: ' + msg + '\nAt: ' + url + ':' + line + '\n' + (err && err.stack || '') + '</pre>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML = '<pre style="padding:2rem;color:red;">PROMISE ERROR: ' + (e.reason && e.reason.stack || e.reason) + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
